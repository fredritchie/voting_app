name: Terraform Apply

on:
  workflow_call:
    secrets:
      TF_API_TOKEN:
        description: HCP Terraform API token with permission to run the Voting_app_CLI workspace
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcp-terraform-voting-app-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply infrastructure in HCP Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Initialize HCP Terraform workspace
        run: terraform init -input=false
      - name: Validate configuration
        run: terraform validate
      - id: plan
        name: Create remote execution plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          plan_exit_code=$?
          set -e

          echo "exit_code=$plan_exit_code" >> "$GITHUB_OUTPUT"

          case "$plan_exit_code" in
            0)
              echo "Terraform reported no infrastructure changes; apply will be skipped."
              ;;
            2)
              echo "Terraform reported infrastructure changes; the saved plan will be applied."
              ;;

            *)
              echo "Terraform plan failed with exit code $plan_exit_code." >&2
              exit "$plan_exit_code"
              ;;
          esac
      - name: Apply the reviewed plan
        if: steps.plan.outputs.exit_code == '2'
        run: terraform apply -input=false -auto-approve tfplan
